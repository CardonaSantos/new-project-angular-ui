<div class="gc-shell" [class.gc-shell-collapsed]="collapsed()" [class.gc-shell-mobile-open]="mobileOpen()">
  <button
    type="button" class="gc-backdrop"
    aria-label="Cerrar menú de navegación"
    [attr.aria-hidden]="mobileOpen() ? null : 'true'"
    [attr.tabindex]="mobileOpen() ? 0 : -1"
    (click)="closeMobile()"></button>
  <div id="gc-primary-navigation" class="gc-navigation">
    <gc-sidebar [items]="items" [collapsed]="collapsed()" [mobileOpen]="mobileOpen()"
      (navigate)="closeMobile()" />
  </div>
  <div class="gc-workspace">
    <gc-topbar
      [collapsed]="collapsed()" [mobileOpen]="mobileOpen()"
      (collapseToggle)="collapsed.set(!collapsed())"
      (mobileToggle)="mobileOpen.set(!mobileOpen())" />
    <main id="gc-main-content" class="gc-content" tabindex="-1">
      <router-outlet />
    </main>
  </div>
</div>
