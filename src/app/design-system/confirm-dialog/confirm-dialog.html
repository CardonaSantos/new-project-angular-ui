<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content>{{ data.message }}</mat-dialog-content>
<mat-dialog-actions align="end">
  <button gcButton variant="outline" [mat-dialog-close]="false">Volver</button>
  <button gcButton [variant]="data.danger ? 'danger' : 'primary'" [mat-dialog-close]="true">
    {{ data.confirmText || 'Confirmar' }}
  </button>
</mat-dialog-actions>
